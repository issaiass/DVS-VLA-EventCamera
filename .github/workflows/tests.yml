name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync

    - name: Lint with black
      run: uv run black --check src/ tests/
      continue-on-error: true

    - name: Type check with mypy
      run: uv run mypy src/
      continue-on-error: true

    - name: Run unit tests
      run: uv run pytest tests/unit/ -v --tb=short

    - name: Run integration tests
      run: uv run pytest tests/integration/ -v --tb=short

    - name: Run E2E tests
      run: uv run pytest tests/e2e/ -v --tb=short

    - name: Generate coverage report
      run: uv run pytest tests/ --cov=src --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Check coverage threshold
      run: uv run pytest tests/ --cov=src --cov-fail-under=85

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync

    - name: Format check (black)
      run: uv run black --check src/ tests/

    - name: Type check (mypy)
      run: uv run mypy src/

    - name: Lint (optional - inform only)
      run: uv run pylint src/ --disable=all --enable=E,F
      continue-on-error: true
