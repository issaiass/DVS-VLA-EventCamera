# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-testing/building-and-testing-python

name: Python Application

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@v2

    - name: Install dependencies
      run: uv sync

    - name: Lint with black
      run: uv run black --check src/ tests/
      continue-on-error: true

    - name: Type check with mypy
      run: uv run mypy src/
      continue-on-error: true

    - name: Test with pytest (all layers)
      run: uv run pytest tests/ -v --tb=short --cov=src --cov-report=term-missing

    - name: Verify coverage meets minimum
      run: uv run pytest tests/ --cov=src --cov-fail-under=85
